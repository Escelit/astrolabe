name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: make fmt-check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build astrolabe-core for wasm32v1-none (no_std check)
        run: cargo build -p astrolabe-core --target wasm32v1-none --release

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint TypeScript packages
        run: pnpm -r lint

      - name: Run TypeScript tests
        run: pnpm -r test

      - name: Build TypeScript packages
        run: pnpm -r build

  conformance:
    name: Conformance & Differential
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm -r build

      - name: Install snarkjs
        run: npm install -g snarkjs@0.7.6

      - name: Conformance vectors check
        run: make vectors-check

      - name: Differential tests
        run: make differential

  verify-artifacts-action:
    name: Verify Proving Artifacts Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Verify Circom multiplier artifacts via GitHub Action
        uses: ./.github/actions/verify-artifacts
        with:
          proof: examples/circom-multiplier/artifacts/proof.json
          vk: examples/circom-multiplier/artifacts/verification_key.json
          public: examples/circom-multiplier/artifacts/public.json
          run-profile: "true"

[workspace]
resolver = "2"
members = [
    "crates/astrolabe-core",
    "crates/astrolabe-verifier",
    "crates/astrolabe-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Escelit/astrolabe"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

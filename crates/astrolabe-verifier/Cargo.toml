[package]
name = "astrolabe-verifier"
description = "Soroban contract helpers and Groth16 verifier template for Astrolabe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
stored-contract = []

[dependencies]
soroban-sdk = "=29.0.1"

[dev-dependencies]
astrolabe-core = { path = "../astrolabe-core" }
soroban-sdk = { version = "=29.0.1", features = ["testutils"] }
soroban-env-host = "=29.0.1"
